name: Claude Code Review

# Runs an AI code-review agent on every pull request. The agent reads the PR
# diff and posts its findings as PR comments (summary + inline). Authenticated
# with a Claude subscription OAuth token (no API key / billing) stored in the
# repo secret CLAUDE_CODE_OAUTH_TOKEN. You can also re-trigger a review by
# commenting `@claude` on a PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Keep only the latest review per PR; a new push cancels an in-flight review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # On comments, only run when someone writes "@claude" on a pull request.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # TEMP diagnostic: surface the real model error instead of the hidden summary.
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            You are reviewing a pull request for PawMeet, an Astro 7 SSR + React 19
            + Supabase app deployed to Cloudflare Workers. Review ONLY the PR diff.
            The PR branch is already checked out in the current working directory;
            read CLAUDE.md for the project conventions before judging.

            Focus, in priority order:
            1. Security & data access — any new Supabase table/policy MUST have RLS
               with granular per-operation, per-role policies; profiles/private
               location must stay owner-only; API routes must validate input with zod
               and export `const prerender = false`.
            2. Correctness — bugs, broken invariants (e.g. the invitation / pack
               consent state machine: only the receiver/addressee may respond; no
               re-open of terminal rows), missing error handling.
            3. UI contract — no color literals (hex/rgb or Tailwind palette classes);
               use semantic tokens and the `cn()` helper; desktop layout must adapt
               at `lg:`.
            4. Tests & conventions — meaningful coverage for risky logic; path alias
               `@/*`; shared types in `src/types.ts`.

            Be concrete and cite file:line. Praise what is genuinely good, but lead
            with the issues. If the diff is clean, say so plainly.

            Post a concise top-level summary with `gh pr comment`, and use
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for specific line-level issues. Only post GitHub comments — do not emit
            the review as plain messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
